<!doctype html><html lang="tr"><meta charset="utf-8"><title>Elifa · Telefon önizlemesi</title>
<style>html,body{margin:0;min-height:100%;background:#0e2035;color:#eee;font:13px system-ui}body{display:grid;justify-items:center;align-content:start}header{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px}button{min-height:32px;border:1px solid #d0b36c;border-radius:7px;background:#fff9ed;color:#18334f;padding:5px 10px}iframe{width:390px;height:700px;max-width:100vw;border:0;background:#fff9ed;box-shadow:0 4px 30px #0007}</style>
<header><span>Yerel telefon önizlemesi</span><button data-page="account">Hesap</button><button data-page="hatim">Birlikte</button><button data-page="member">Üye hatmi</button><button data-size="360,640">360 × 640</button><button data-size="390,844">390 × 844</button></header>
<iframe title="Telefon ekranı" src="/scripts/account-layout-review.html"></iframe>
<script>if(!/^(localhost|127\.0\.0\.1)$/.test(location.hostname))throw Error('Yalnız yerel önizleme');const frame=document.querySelector('iframe');document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>frame.src=b.dataset.page==='account'?'/scripts/account-layout-review.html':b.dataset.page==='member'?'/scripts/member-hatim-review.html':'/?compact-review=361');document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{const [w,h]=b.dataset.size.split(',');frame.style.width=w+'px';frame.style.height=h+'px'});</script></html>
